
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu Compra - Tienda de Música</title>

    <style>
        body {
            background-color: #0b020f;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
            margin: 0;
        }

        .contenedor-carrito {
            max-width: 800px;
            margin: 0 auto;
            background: #190a21;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid hwb(278 97% 0%);
        }

        .item-disco {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            padding: 15px 0;
            gap: 15px;
        }

        .item-disco img {
            border-radius: 5px;
            object-fit: cover;
        }

        .info-disco {
            flex-grow: 1;
            margin-left: 20px;
        }

        .btn-eliminar {
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-eliminar:hover {
            background-color: darkred;
            transform: scale(1.1);
        }

        .btn-vaciar {
            background: #ff3366;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: hwb(278 97% 0%);
            color: #000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="contenedor-carrito">

        <h1>Productos en tu carrito</h1>

        <div id="lista-compra"></div>

        <div id="zona-total" style="margin-top: 30px; text-align: right;"></div>

        <a href="Index.html" class="btn-volver">Volver a la tienda</a>

    </div>

    <script>

        function mostrarProductos() {

            const listaCarrito = JSON.parse(localStorage.getItem("carritoTienda")) || [];

            const contenedorLista = document.getElementById("lista-compra");
            const contenedorTotal = document.getElementById("zona-total");

            if (listaCarrito.length === 0) {

                contenedorLista.innerHTML = "<h3 style='text-align:center; opacity:0.6;'>Tu carrito está completamente vacío.</h3>";

                contenedorTotal.innerHTML = "";

                return;
            }

            contenedorLista.innerHTML = "";

            let granTotal = 0;

            listaCarrito.forEach((prod, indice) => {

                let subtotal = prod.precio * prod.cantidad;

                granTotal += subtotal;

                contenedorLista.innerHTML += `
                    <div class="item-disco">

                        <img src="${prod.imagen}" width="70">

                        <div class="info-disco">

                            <h3>${prod.titulo}</h3>

                            <p>Cantidad: ${prod.cantidad}</p>

                        </div>

                        <h3>$${subtotal.toLocaleString('es-AR')}</h3>

                        <button class="btn-eliminar" onclick="eliminarProducto(${indice})">
                            X
                        </button>

                    </div>
                `;

            });

            contenedorTotal.innerHTML = `
                <h2>Total a pagar: $${granTotal.toLocaleString('es-AR')}</h2>

                <button onclick="limpiarTodo()" class="btn-vaciar">
                    Vaciar Carrito
                </button>
            `;

        }


        // Elimina solamente el producto seleccionado

        function eliminarProducto(indice) {

            let listaCarrito = JSON.parse(localStorage.getItem("carritoTienda")) || [];

            listaCarrito.splice(indice, 1);

            localStorage.setItem("carritoTienda", JSON.stringify(listaCarrito));

            mostrarProductos();

        }


        // Elimina todos los productos

        function limpiarTodo() {

            localStorage.removeItem("carritoTienda");

            mostrarProductos();

        }


        // Muestra los productos al entrar al carrito

        mostrarProductos();

    </script>

</body>
</html>
