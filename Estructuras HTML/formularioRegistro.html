<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistroDeUsuario</title>
</head>
<body>
    <h1>Registrarse como cliente </h1>
    <fieldset>
        <legend>Complete los datos para su registro</legend> 
                <label for="nombre">Nombre </label><br>
                <input type="text" name="nombre" id="nombreCliente" size="20" required><br>
                <label for="apellido">Apellido</label><br>
                <input type="text" name="apellido" id="apellidoCliente" size="20" required><br>
                <label for="Dni">DNI</label><br>
                <input type="text" name="Dni" id="DocumentoNacional" size="20" minlength="9" maxlength="9" required><br>
                <label for="CorreoElect">Correo Electronico</label><br>
                <input type="email" name="Correo" id="CorreoElectronico" size="25" required><br>
                <label for="contraseña">Contraseñaa</label><br>
                <input type="text" name="ContraseñaUsuario" id="Contraseña" size="25" required><br>

                <br>    
                 <input type="checkbox" name="acuerdosYcondiciones" value="acepta" id="acuerdos" required>
                 <label for="acuerdosYcondiciones"><a href="https://youtu.be/PyoRdu-i0AQ?si=R7X1uUyKxEaJAXKr">Acepto términos y condiciones</label></a><br>
                <br>
                        
    </fieldset>
    <br>    
    <input type="submit" name="RegistroUsuario" value="Acepto registrarme">

    
</body>
</html>
