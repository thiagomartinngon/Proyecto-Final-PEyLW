<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMaxYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.6" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <pattern id="dotsPink" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3.5" fill="#ff2d95"/>
    </pattern>
    <pattern id="dotsYellow" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3.5" fill="#ffd400"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="#050005"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- ======= ESQUINA INFERIOR DERECHA ======= -->
  <!-- circulo grande -->
  <circle cx="1860" cy="1020" r="190" fill="#e6007e" opacity="0.9"/>

  <!-- triangulo violeta -->
  <polygon points="1380,1080 1660,1080 1660,850" fill="#7b2fd0" opacity="0.92"/>

  <!-- vinilo -->
  <g transform="translate(1790 700)">
    <circle r="88" fill="#1b0033" stroke="#7b2fd0" stroke-width="5"/>
    <circle r="68" fill="none" stroke="#7b2fd0" stroke-width="2"/>
    <circle r="50" fill="none" stroke="#7b2fd0" stroke-width="2"/>
    <circle r="31" fill="#e6007e"/>
    <circle r="5" fill="#050005"/>
  </g>

  <!-- semicirculo naranja en el borde derecho -->
  <path d="M1920 440 a100 100 0 0 0 0 200 z" fill="#ff7a00" opacity="0.92"/>

  <!-- aro cyan -->
  <circle cx="1560" cy="790" r="38" fill="none" stroke="#00d0f0" stroke-width="9"/>

  <!-- bloques de puntos -->
  <rect x="1240" y="880" width="110" height="110" fill="url(#dotsPink)"/>
  <rect x="1490" y="560" width="132" height="88" fill="url(#dotsYellow)"/>

  <!-- ondas amarillas en el borde inferior -->
  <path d="M1000 1030 q35 -38 70 0 t70 0 t70 0 t70 0 t70 0" fill="none" stroke="#ffd400" stroke-width="7" stroke-linecap="round"/>
  <path d="M1000 1056 q35 -38 70 0 t70 0 t70 0 t70 0 t70 0" fill="none" stroke="#ffd400" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

  <!-- teclas de piano -->
  <g opacity="0.95">
    <rect x="680" y="1000" width="34" height="80" fill="#ff2d95"/>
    <rect x="718" y="1000" width="34" height="80" fill="#ffb3d9"/>
    <rect x="756" y="1000" width="34" height="80" fill="#ff2d95"/>
    <rect x="794" y="1000" width="34" height="80" fill="#ffb3d9"/>
  </g>

  <!-- ondita rosa en el borde derecho -->
  <path d="M1880 160 v0" stroke="none"/>
  <path d="M1560 450 q30 -34 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#ff2d95" stroke-width="7" stroke-linecap="round"/>

  <!-- notas musicales -->
  <g fill="#ffb3d9" opacity="0.9">
    <ellipse cx="1420" cy="760" rx="20" ry="14" transform="rotate(-20 1420 760)"/>
    <rect x="1435" y="670" width="6" height="90"/>
    <path d="M1441 670 q34 8 24 42 q-5 -18 -24 -22 z"/>
  </g>
  <g fill="#00d0f0" opacity="0.85">
    <ellipse cx="1100" cy="930" rx="17" ry="12" transform="rotate(-20 1100 930)"/>
    <rect x="1113" y="860" width="6" height="70"/>
  </g>

  <!-- puntitos sueltos -->
  <circle cx="1330" cy="1020" r="8" fill="#ffd400"/>
  <circle cx="1360" cy="1020" r="8" fill="#7b2fd0"/>
  <circle cx="1390" cy="1020" r="8" fill="#ff2d95"/>
  <circle cx="1700" cy="560" r="8" fill="#00d0f0"/>
  <circle cx="1880" cy="340" r="8" fill="#ffd400"/>
  <circle cx="1600" cy="700" r="8" fill="#ff7a00"/>
</svg>
