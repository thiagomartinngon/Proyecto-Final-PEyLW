<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.6" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <pattern id="dotsPink" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3.5" fill="#ff2d95"/>
    </pattern>
    <pattern id="dotsYellow" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3.5" fill="#ffd400"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="900" fill="#050005"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- circulos -->
  <circle cx="170" cy="150" r="90" fill="#e6007e" opacity="0.55"/>
  <circle cx="980" cy="700" r="110" fill="#00d0f0" opacity="0.35"/>
  <circle cx="640" cy="420" r="38" fill="none" stroke="#ffd400" stroke-width="8" opacity="0.7"/>

  <!-- vinilo -->
  <g transform="translate(900 190)" opacity="0.55">
    <circle r="85" fill="#1b0033" stroke="#7b2fd0" stroke-width="4"/>
    <circle r="65" fill="none" stroke="#7b2fd0" stroke-width="2"/>
    <circle r="48" fill="none" stroke="#7b2fd0" stroke-width="2"/>
    <circle r="30" fill="#e6007e"/>
    <circle r="5" fill="#050005"/>
  </g>

  <!-- triangulos -->
  <polygon points="80,640 300,640 80,820" fill="#7b2fd0" opacity="0.6"/>
  <polygon points="760,60 880,60 820,160" fill="#ff7a00" opacity="0.7"/>

  <!-- semicirculo -->
  <path d="M420 860 A110 110 0 0 1 640 860 Z" fill="#ff7a00" opacity="0.55"/>

  <!-- bloques de puntos -->
  <rect x="330" y="90" width="176" height="110" fill="url(#dotsPink)" opacity="0.8"/>
  <rect x="1000" y="470" width="154" height="110" fill="url(#dotsYellow)" opacity="0.75"/>

  <!-- ondas -->
  <path d="M40 400 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#ffd400" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M40 425 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#ffd400" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M700 590 q35 -35 70 0 t70 0 t70 0 t70 0" fill="none" stroke="#ff2d95" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- teclas de piano -->
  <g opacity="0.75">
    <rect x="520" y="650" width="34" height="120" fill="#ff2d95"/>
    <rect x="558" y="650" width="34" height="120" fill="#ffb3d9"/>
    <rect x="596" y="650" width="34" height="120" fill="#ff2d95"/>
    <rect x="634" y="650" width="34" height="120" fill="#ffb3d9"/>
  </g>

  <!-- notas musicales -->
  <g fill="#ffb3d9" opacity="0.65">
    <ellipse cx="1060" cy="360" rx="22" ry="16" transform="rotate(-20 1060 360)"/>
    <rect x="1076" y="260" width="7" height="100"/>
    <path d="M1083 260 q40 10 28 50 q-6 -22 -28 -26 z"/>
  </g>
  <g fill="#00d0f0" opacity="0.55">
    <ellipse cx="260" cy="560" rx="18" ry="13" transform="rotate(-20 260 560)"/>
    <rect x="274" y="480" width="6" height="80"/>
  </g>

  <!-- detalles sueltos -->
  <circle cx="560" cy="130" r="7" fill="#ffd400"/>
  <circle cx="590" cy="130" r="7" fill="#7b2fd0"/>
  <circle cx="620" cy="130" r="7" fill="#ff2d95"/>
  <circle cx="400" cy="740" r="9" fill="#00d0f0"/>
  <circle cx="1120" cy="820" r="9" fill="#ff7a00"/>
  <circle cx="90" cy="290" r="9" fill="#ff2d95"/>
</svg>
